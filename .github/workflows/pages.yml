name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ielts-study-garden/package-lock.json
      - run: npm ci
      - uses: actions/configure-pages@v5
      - name: Build IELTS Study Garden
        working-directory: ielts-study-garden
        run: |
          npm ci
          npm test
          npm run build:pages
      - run: npm run build
        env:
          BUILD_TARGET: pages
      - name: Add IELTS site without replacing the existing scrapbook
        run: |
          mkdir -p out/ielts
          cp -R ielts-study-garden/dist/. out/ielts/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
